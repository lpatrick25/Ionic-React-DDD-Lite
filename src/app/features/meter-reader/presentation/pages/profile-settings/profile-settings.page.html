<ion-content fullscreen>
  <!-- Banner -->
  <div class="profile-banner">
    <img src="assets/illustration.png" alt="Profile Banner" />
  </div>

  <!-- User Card -->
  <ion-card class="profile-card" *ngIf="user">
    <ion-avatar class="profile-avatar">
      <img
        src="https://ui-avatars.com/api/?name={{user.name}}&background=4e8ef7&color=fff"
      />
    </ion-avatar>
    <ion-card-header>
      <ion-card-title>{{ user.name }}</ion-card-title>
      <ion-card-subtitle>{{ user.email }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <ion-badge color="primary">{{ user.role }}</ion-badge>
    </ion-card-content>
  </ion-card>

  <!-- Settings List -->
  <ion-list inset="true" class="settings-list">
    <ion-item button detail>
      <ion-icon name="create-outline" slot="start"></ion-icon>
      <ion-label>Edit Profile</ion-label>
    </ion-item>

    <ion-item button detail>
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-label>Change Password</ion-label>
    </ion-item>

    <ion-item button detail>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-label>Notifications</ion-label>
    </ion-item>

    <ion-item button detail>
      <ion-icon name="settings-outline" slot="start"></ion-icon>
      <ion-label>App Settings</ion-label>
    </ion-item>

    <app-sync-button></app-sync-button>

    <ion-item button color="danger" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      <ion-label>Logout</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
