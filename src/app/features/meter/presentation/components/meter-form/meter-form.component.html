<ion-card>
  <ion-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Validation Summary (Always Visible, Not Dismissible) -->
      <ion-card
        *ngIf="getFormErrorsCount() > 0 && form.touched"
        class="alert alert-danger summary-card"
        role="alert"
      >
        <ion-card-header>
          <ion-card-title>
            <ion-icon name="alert-circle-outline" color="warning"></ion-icon>
            Form Errors
          </ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ul class="error-list">
            <li *ngFor="let error of getAllErrorMessages()">
              <ion-icon
                name="warning-outline"
                slot="start"
                color="danger"
              ></ion-icon>
              {{ error }}
            </li>
          </ul>
        </ion-card-content>
      </ion-card>

      <!-- Consumer Selection -->
      <ion-item
        [class.invalid]="
          f['consumerId'].invalid && f['consumerId'].touched
        "
      >
        <ion-label position="stacked">
          Consumer <ion-text color="danger">*</ion-text>
        </ion-label>
        <ion-select
          formControlName="consumerId"
          interface="action-sheet"
          placeholder="Select consumer"
        >
          <ion-select-option
            *ngFor="let consumer of consumers"
            [value]="consumer.id"
          >
            {{ consumer.fullName }} ({{ consumer.accountNumber }})
          </ion-select-option>
        </ion-select>
        <ion-note
          *ngIf="f['consumerId'].invalid && f['consumerId'].touched"
          class="inline-error"
          slot="error"
        >
          <ion-icon name="alert-circle-outline" slot="start"></ion-icon>
          {{ getErrorMessage("consumerId") }}
        </ion-note>
      </ion-item>

      <!-- Installation Date -->
      <ion-item
        [class.invalid]="
          f['installationDate'].invalid && f['installationDate'].touched
        "
      >
        <ion-label position="stacked">
          Installation Date <ion-text color="danger">*</ion-text>
        </ion-label>
        <ion-input formControlName="installationDate" type="date"></ion-input>
        <ion-note
          *ngIf="f['installationDate'].invalid && f['installationDate'].touched"
          class="inline-error"
          slot="error"
        >
          <ion-icon name="alert-circle-outline" slot="start"></ion-icon>
          {{ getErrorMessage("installationDate") }}
        </ion-note>
      </ion-item>

      <!-- Action Buttons -->
      <div class="ion-padding action-buttons">
        <ion-button
          expand="block"
          type="submit"
          [disabled]="isLoading"
          color="primary"
        >
          <ion-spinner
            *ngIf="isLoading"
            name="crescent"
            slot="start"
          ></ion-spinner>
          {{ isEditMode ? "Update Meter" : "Create Meter" }}
        </ion-button>

        <ion-button
          expand="block"
          fill="clear"
          (click)="onCancel()"
          [disabled]="isLoading"
          color="medium"
        >
          Cancel
        </ion-button>
      </div>
    </form>
  </ion-card-content>
</ion-card>
